[project]
name = "sabbatical"
version = "0.1.0"
description = "Sabbatical - AI Agent Orchestration CLI"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "databases[aiosqlite]>=0.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "prompt-toolkit>=3.0.0",
    "google-adk[extensions]>=0.1.0"
]

[project.scripts]
sabbatical = "sabbatical.cli.main:app"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
